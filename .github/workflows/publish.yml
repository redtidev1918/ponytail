name: publish

on:
  # Fork is intentionally unmanaged by ReleaseGraph: this publishes the
  # upstream author's scoped package (@dietrichgebert/ponytail) via OIDC
  # trust configured on DietrichGebert/ponytail, not here. No automatic
  # tag trigger; only an explicit, deliberate workflow_dispatch can run it.
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 ships npm 10.
      - run: npm install -g npm@latest
      # No token: id-token: write above lets npm authenticate via OIDC, and
      # provenance is attached automatically. access set in publishConfig.
      - run: npm publish
